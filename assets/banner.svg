<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>

    <!-- Node Gradient -->
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#090979;stop-opacity:1" />
    </radialGradient>

    <!-- Line Gradient -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Animated Vector Network -->
  <g filter="url(#glow)">
    <!-- Animated Lines -->
    <g stroke="url(#lineGradient)" stroke-width="1.5" fill="none" opacity="0.6">
      <line x1="100" y1="150" x2="200" y2="100">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="100" x2="350" y2="180">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <line x1="350" y1="180" x2="500" y2="80">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="500" y1="80" x2="650" y2="160">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="650" y1="160" x2="800" y2="90">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/>
      </line>
      <line x1="800" y1="90" x2="950" y2="170">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.2s" repeatCount="indefinite"/>
      </line>
      <line x1="950" y1="170" x2="1100" y2="100">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite"/>
      </line>
      
      <!-- Cross connections -->
      <line x1="200" y1="100" x2="500" y2="80" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
      </line>
      <line x1="350" y1="180" x2="650" y2="160" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.5s" repeatCount="indefinite"/>
      </line>
      <line x1="500" y1="80" x2="800" y2="90" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.8s" repeatCount="indefinite"/>
      </line>
      <line x1="650" y1="160" x2="950" y2="170" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.2s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Animated Nodes -->
    <g fill="url(#nodeGradient)">
      <circle cx="100" cy="150" r="8">
        <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="100" r="6">
        <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="350" cy="180" r="7">
        <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="80" r="6">
        <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="160" r="8">
        <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="90" r="5">
        <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="170" r="7">
        <animate attributeName="r" values="5;9;5" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="100" r="6">
        <animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Floating Particles -->
    <g fill="#00d4ff" opacity="0.5">
      <circle cx="150" cy="200" r="2">
        <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="250" r="3">
        <animate attributeName="cy" values="250;230;250" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="220" r="2">
        <animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="240" r="3">
        <animate attributeName="cy" values="240;210;240" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="750" cy="200" r="2">
        <animate attributeName="cy" values="200;180;200" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="230" r="3">
        <animate attributeName="cy" values="230;200;230" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="210" r="2">
        <animate attributeName="cy" values="210;190;210" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Title Text -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)">
    Awesome Vector Search Platform
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0" opacity="0.8">
    Embedding Storage • ANN Search • Hybrid Retrieval • RAG Infrastructure
  </text>
</svg>